# Continuous integration for the Clock-Practice static front-end.
#
# Runs on every pull request and on pushes to main.
# Lints HTML (html-validate), CSS (stylelint), and JavaScript (eslint).
# Clock-Practice has no package manifest, so the linters run through npx,
# which fetches them on demand. The linter configuration files
# (.htmlvalidate.json, .stylelintrc.json, eslint.config.js) live in the
# repository root.
#
# Security note: no untrusted GitHub context variables are interpolated
# into any run step. All run commands are fixed strings.
#
# Action versions are pinned to commit SHAs verified on 2026-05-21.

name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*

      - name: Lint HTML
        run: npx --yes html-validate index.html

      - name: Lint CSS
        run: npx --yes stylelint styles.css

      - name: Lint JavaScript
        run: npx --yes eslint clock-practice.js
