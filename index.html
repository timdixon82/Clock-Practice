<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#87CEEB">
<title>Clock Practice</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /*
    Colour palette — every pair verified against WCAG 2.1:
      Body text #1A2340 on lightest gradient point #FFB6C1   -> 9.3:1  (AAA)
      Stat label #495057 on white                            -> 7.5:1  (AAA)
      Stat value / dark text #0A2342 on white                -> 17:1   (AAA)
      White on primary green #15803D                         -> 5.0:1  (AA)
      White on share purple #6B21A8                          -> 8.7:1  (AAA)
      White on +/- blue #1D4ED8                              -> 6.6:1  (AA / near AAA)
      Dark navy #0A2342 on brand orange #FF6F00              -> 5.6:1  (AA)
      Clock minute hand #C2410C on white                     -> 5.1:1  (AA / 3:1 graphical OK)
      Clock face border #C2410C on white                     -> 5.1:1  (graphical 3:1 OK)
      Hour hand / numbers / hour markers #0A2342 on white    -> 17:1   (AAA)
      Minor minute markers #555 on white                     -> 7.8:1  (AAA)
      Correct feedback #0F5132 on #D4EDDA                    -> 7.4:1  (AAA)
      Wrong feedback #664D03 on #FFF3CD                      -> 7.8:1  (AAA)
      Disabled button white on #475569                       -> 6.8:1  (AAA, even when "off")
      Focus ring #0A2342 outline at 4px outside any element  -> high contrast on any background
  */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 20px;
    min-height: 100vh;
    background: linear-gradient(135deg, #87CEEB 0%, #FFB6C1 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #1A2340;
  }

  h1 {
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    margin: 10px 0 18px;
    text-align: center;
    color: #0A2342;
    white-space: nowrap;
  }

  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-box {
    background: white;
    padding: 12px 22px;
    border-radius: 14px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    text-align: center;
    min-width: 130px;
  }

  .stat-label {
    font-size: 0.85rem;
    color: #495057;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #0A2342;
  }

  .clock-container {
    background: white;
    border-radius: 50%;
    padding: 16px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.22);
    margin-bottom: 26px;
  }

  svg.clock {
    display: block;
    width: 320px;
    height: 320px;
  }

  .panel {
    background: white;
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    margin-bottom: 16px;
    width: 100%;
    max-width: 520px;
  }

  .input-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: flex-end;
    margin-bottom: 18px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .input-group > label {
    font-size: 1.05rem;
    font-weight: bold;
    color: #0A2342;
    margin-bottom: 8px;
  }

  .number-control {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #F1F5F9;
    padding: 8px;
    border-radius: 12px;
    border: 2px solid #CBD5E1;
  }

  .number-btn {
    width: 54px;
    height: 54px;
    border: none;
    background: #1D4ED8;
    color: white;
    border-radius: 10px;
    font-size: 2rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .number-btn:hover { background: #1E40AF; }
  .number-btn:active { transform: scale(0.95); }
  .number-btn:disabled { background: #475569; opacity: 0.7; cursor: not-allowed; }

  .number-display {
    font-size: 2.5rem;
    font-weight: bold;
    min-width: 84px;
    text-align: center;
    background: white;
    color: #0A2342;
    padding: 6px 10px;
    border-radius: 10px;
    border: 2px solid #475569;
  }

  .colon {
    font-size: 3rem;
    font-weight: bold;
    color: #0A2342;
    align-self: center;
    padding-bottom: 8px;
  }

  button.primary, button.secondary, button.share {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 1.25rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 6px;
  }

  button.primary { background: #15803D; color: white; }
  button.primary:hover { background: #166534; }

  button.secondary { background: #FF6F00; color: #0A2342; }
  button.secondary:hover { background: #E55F00; }

  button.share { background: #6B21A8; color: white; }
  button.share:hover { background: #581C87; }

  button.primary:disabled,
  button.share:disabled {
    background: #475569;
    color: white;
    opacity: 0.7;
    cursor: not-allowed;
  }

  button:active:not(:disabled) { transform: scale(0.98); }

  /* High-contrast focus ring usable on any background */
  button:focus-visible,
  .number-btn:focus-visible,
  .number-display:focus-visible {
    outline: 4px solid #0A2342;
    outline-offset: 3px;
  }

  .feedback {
    text-align: center;
    padding: 18px;
    border-radius: 14px;
    margin-top: 14px;
    font-size: 1.2rem;
    font-weight: bold;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .feedback.correct {
    background: #D4EDDA;
    color: #0F5132;
    border: 3px solid #15803D;
    animation: pop 0.5s ease;
  }

  .feedback.wrong {
    background: #FFF3CD;
    color: #664D03;
    border: 3px solid #B45309;
  }

  .feedback.empty { display: none; }

  @keyframes pop {
    0%   { transform: scale(0.85); }
    50%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .celebration {
    font-size: 4.5rem;
    line-height: 1;
    animation: bounce 0.6s ease;
    display: block;
    margin-bottom: 6px;
  }

  @keyframes bounce {
    0%   { transform: scale(0); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 520px;
  }

  .actions > button {
    flex: 1;
    min-width: 140px;
  }

  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 999;
    animation: fall 3s linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }

  /* On small phones, stack hour/colon/minutes vertically so the colon never sits alone */
  @media (max-width: 540px) {
    .input-row {
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .colon {
      font-size: 2rem;
      padding-bottom: 0;
      line-height: 1;
    }
  }

  /* Scale the clock down a little on small screens */
  @media (max-width: 360px) {
    svg.clock { width: 270px; height: 270px; }
    .clock-container { padding: 12px; }
  }
</style>
</head>
<body>

<h1><span aria-hidden="true">🕐</span> Clock Practice <span aria-hidden="true">🕐</span></h1>

<div class="stats" role="group" aria-label="Game statistics">
  <div class="stat-box">
    <div class="stat-label">Tries This Clock</div>
    <div class="stat-value" id="attempts">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Clocks Solved</div>
    <div class="stat-value" id="correct-count">0</div>
  </div>
</div>

<div class="clock-container">
  <svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Practice clock. Look at the two hands and enter the time using the controls below.">
    <circle cx="100" cy="100" r="95" fill="white" stroke="#C2410C" stroke-width="5"/>
    <g id="minute-markers" aria-hidden="true"></g>
    <g id="hour-numbers" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0A2342" aria-hidden="true"></g>
    <line id="hour-hand"   x1="100" y1="100" x2="100" y2="55" stroke="#0A2342" stroke-width="6" stroke-linecap="round"/>
    <line id="minute-hand" x1="100" y1="100" x2="100" y2="28" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#C2410C"/>
    <circle cx="100" cy="100" r="3" fill="#0A2342"/>
  </svg>
</div>

<div class="panel">
  <div class="input-row">
    <div class="input-group">
      <label id="hour-label" for="hour-display">Hour</label>
      <div class="number-control" role="group" aria-labelledby="hour-label">
        <button class="number-btn" aria-label="Decrease hour" onclick="changeHour(-1)">−</button>
        <span class="number-display" id="hour-display" role="spinbutton"
              aria-valuemin="1" aria-valuemax="12" aria-valuenow="3"
              tabindex="0">3</span>
        <button class="number-btn" aria-label="Increase hour" onclick="changeHour(1)">+</button>
      </div>
    </div>

    <div class="colon" aria-hidden="true">:</div>

    <div class="input-group">
      <label id="minute-label" for="minute-display">Minutes</label>
      <div class="number-control" role="group" aria-labelledby="minute-label">
        <button class="number-btn" aria-label="Decrease minutes by five" onclick="changeMinute(-5)">−</button>
        <span class="number-display" id="minute-display" role="spinbutton"
              aria-valuemin="0" aria-valuemax="55" aria-valuenow="0"
              tabindex="0">00</span>
        <button class="number-btn" aria-label="Increase minutes by five" onclick="changeMinute(5)">+</button>
      </div>
    </div>
  </div>

  <button class="primary" id="check-btn" onclick="checkAnswer()">Check My Answer ✓</button>

  <div class="feedback empty" id="feedback" role="status" aria-live="assertive"></div>

  <div class="actions">
    <button class="secondary" onclick="newClock()">New Clock 🔄</button>
    <button class="share" id="share-btn" onclick="share()" disabled>Share with Mum &amp; Dad 📤</button>
  </div>
</div>

<script>
  let currentHour = 3;
  let currentMinute = 0;
  let userHour = 12;
  let userMinute = 0;
  let attempts = 0;
  let correctCount = 0;
  let solved = false;

  function attachKeyboardSupport() {
    const hourEl = document.getElementById('hour-display');
    const minEl  = document.getElementById('minute-display');

    hourEl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { changeHour(1); e.preventDefault(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { changeHour(-1); e.preventDefault(); }
    });

    minEl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { changeMinute(5); e.preventDefault(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { changeMinute(-5); e.preventDefault(); }
    });
  }

  function init() {
    const markers = document.getElementById('minute-markers');
    for (let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const isHour = i % 5 === 0;
      const r1 = isHour ? 80 : 86;
      const r2 = 92;
      const x1 = 100 + r1 * Math.cos(angle);
      const y1 = 100 + r1 * Math.sin(angle);
      const x2 = 100 + r2 * Math.cos(angle);
      const y2 = 100 + r2 * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', isHour ? '#0A2342' : '#555555');
      line.setAttribute('stroke-width', isHour ? 2.5 : 1);
      markers.appendChild(line);
    }

    const numbers = document.getElementById('hour-numbers');
    for (let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * Math.PI / 180;
      const x = 100 + 70 * Math.cos(angle);
      const y = 100 + 70 * Math.sin(angle) + 6;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', x); text.setAttribute('y', y);
      text.textContent = i;
      numbers.appendChild(text);
    }

    attachKeyboardSupport();
    newClock();
  }

  function newClock() {
    currentHour = Math.floor(Math.random() * 12) + 1;
    currentMinute = Math.floor(Math.random() * 12) * 5;

    const minuteAngle = currentMinute * 6;
    const hourAngle = (currentHour % 12) * 30 + currentMinute * 0.5;

    document.getElementById('hour-hand').setAttribute('transform', `rotate(${hourAngle} 100 100)`);
    document.getElementById('minute-hand').setAttribute('transform', `rotate(${minuteAngle} 100 100)`);

    attempts = 0;
    solved = false;
    document.getElementById('attempts').textContent = '0';

    userHour = 12;
    userMinute = 0;
    updateDisplay();

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback empty';
    feedback.textContent = '';

    document.getElementById('share-btn').disabled = true;
    document.getElementById('check-btn').disabled = false;
  }

  function changeHour(delta) {
    if (solved) return;
    userHour += delta;
    if (userHour > 12) userHour = 1;
    if (userHour < 1) userHour = 12;
    updateDisplay();
  }

  function changeMinute(delta) {
    if (solved) return;
    userMinute += delta;
    if (userMinute >= 60) userMinute = 0;
    if (userMinute < 0) userMinute = 55;
    updateDisplay();
  }

  function updateDisplay() {
    const hEl = document.getElementById('hour-display');
    const mEl = document.getElementById('minute-display');
    hEl.textContent = userHour;
    hEl.setAttribute('aria-valuenow', userHour);
    mEl.textContent = userMinute.toString().padStart(2, '0');
    mEl.setAttribute('aria-valuenow', userMinute);
  }

  function checkAnswer() {
    if (solved) return;
    attempts++;
    document.getElementById('attempts').textContent = attempts;

    const feedback = document.getElementById('feedback');

    if (userHour === currentHour && userMinute === currentMinute) {
      solved = true;
      correctCount++;
      document.getElementById('correct-count').textContent = correctCount;
      feedback.className = 'feedback correct';
      feedback.innerHTML =
        `<div>
           <span class="celebration" aria-hidden="true">✅</span>
           <div>Brilliant! You got it right!</div>
           <div style="font-size:1rem;margin-top:6px;font-weight:normal;">
             It was ${formatTime(currentHour, currentMinute)} — solved in ${attempts} ${attempts === 1 ? 'try' : 'tries'}!
           </div>
         </div>`;
      document.getElementById('share-btn').disabled = false;
      document.getElementById('check-btn').disabled = true;
      launchConfetti();
    } else {
      feedback.className = 'feedback wrong';
      let hint;
      if (userHour !== currentHour && userMinute !== currentMinute) {
        hint = 'Have another look at both hands.';
      } else if (userHour !== currentHour) {
        hint = 'Check the short hand — that one shows the hour.';
      } else {
        hint = 'Check the long hand — that one shows the minutes.';
      }
      feedback.textContent = `Not quite! ${hint} Try again 💪`;
    }
  }

  function formatTime(h, m) {
    return `${h}:${m.toString().padStart(2, '0')}`;
  }

  function launchConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#FF6F00', '#0A2342', '#15803D', '#6B21A8', '#FFD700', '#C2410C', '#1D4ED8'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.setAttribute('aria-hidden', 'true');
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-15px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  // ---------- Share-image generation ----------

  function roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  async function generateShareImage() {
    const svgEl = document.querySelector('svg.clock');
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('width', '400');
    clone.setAttribute('height', '400');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

    const svgString = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
          const W = 600, H = 800;
          const canvas = document.createElement('canvas');
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext('2d');

          // Background gradient (matches the app)
          const grad = ctx.createLinearGradient(0, 0, W, H);
          grad.addColorStop(0, '#87CEEB');
          grad.addColorStop(1, '#FFB6C1');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          // Title — dark navy on light gradient (>9:1 contrast)
          ctx.fillStyle = '#0A2342';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.font = 'bold 44px -apple-system, "Helvetica Neue", Arial, sans-serif';
          ctx.fillText('I read the clock!', W / 2, 75);

          // White card with shadow
          const cardX = 80, cardY = 110, cardW = 440, cardH = 440, cardR = 28;
          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.22)';
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 10;
          ctx.fillStyle = 'white';
          roundedRect(ctx, cardX, cardY, cardW, cardH, cardR);
          ctx.fill();
          ctx.restore();

          // Clock inside card
          ctx.drawImage(img, cardX + 20, cardY + 20, cardW - 40, cardH - 40);

          // Time
          ctx.fillStyle = '#0A2342';
          ctx.font = 'bold 64px -apple-system, "Helvetica Neue", Arial, sans-serif';
          ctx.fillText(formatTime(currentHour, currentMinute), W / 2, 625);

          // Subtitle
          ctx.font = '28px -apple-system, "Helvetica Neue", Arial, sans-serif';
          ctx.fillText(
            `Solved in ${attempts} ${attempts === 1 ? 'try' : 'tries'}`,
            W / 2,
            670
          );

          // Tick badge — dark green circle, white tick (5:1+ contrast)
          const cx = W / 2, cy = 740, r = 32;
          ctx.fillStyle = '#15803D';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(cx - 14, cy + 1);
          ctx.lineTo(cx - 4, cy + 12);
          ctx.lineTo(cx + 16, cy - 10);
          ctx.stroke();

          URL.revokeObjectURL(url);

          canvas.toBlob((blob) => {
            if (blob) {
              resolve(new File([blob], 'clock-practice.png', { type: 'image/png' }));
            } else {
              reject(new Error('toBlob returned null'));
            }
          }, 'image/png', 0.95);
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('SVG image failed to load'));
      };
      img.src = url;
    });
  }

  // ---------- Sharing ----------

  async function share() {
    const time = formatTime(currentHour, currentMinute);
    const text = `🕐 I read the clock! It said ${time} and I got it right in ${attempts} ${attempts === 1 ? 'try' : 'tries'}! 🎉`;
    const title = 'Clock Practice — Got it right!';

    let file = null;
    try {
      file = await generateShareImage();
    } catch (e) {
      console.warn('Could not generate share image:', e);
    }

    // Best path: native share with image attached
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ title, text, files: [file] });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // user cancelled
        // otherwise fall through to next option
      }
    }

    // Fallback 1: native share, text only (also save the image so it's not lost)
    if (navigator.share) {
      try {
        await navigator.share({ title, text });
        if (file) downloadFile(file);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }

    // Fallback 2: download image + copy text to clipboard
    fallbackShare(text, file);
  }

  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function fallbackShare(text, file) {
    if (file) downloadFile(file);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => alert('Image saved to your downloads, and the message has been copied. Paste it into a message to Mum and Dad along with the picture!'),
        () => alert(text)
      );
    } else {
      alert(text);
    }
  }

  init();
</script>
